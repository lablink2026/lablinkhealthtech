version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lablink-postgres
    restart: always
    environment:
      POSTGRES_USER: lablink_admin
      POSTGRES_PASSWORD: lablink_secret_password
      POSTGRES_DB: lablink_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lablink_admin -d lablink_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
